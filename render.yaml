# Blueprint opcional de Render: "New > Blueprint" y elige este repositorio.
services:
  - type: web
    name: class-fighters-relay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
